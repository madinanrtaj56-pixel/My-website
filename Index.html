
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менің сайтым</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 55px 15px;
      background: linear-gradient(135deg, #6548ee, #13b9bd);
    }
    h1 { font-size: 34px; }
    main { padding: 25px 18px; }
    .card {
      background: #202c40;
      padding: 22px;
      border-radius: 16px;
      margin: 18px auto;
      max-width: 420px;
    }
    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      background: #7658ff;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Менің сайтыма қош келдің!</h1>
    <p>Бұл — менің алғашқы сайтым 🚀</p>
  </header>
  <main>
    <div class="card">
      <h2>Мен туралы</h2>
      <p>Мен өз сайтымды телефон арқылы жасадым.</p>
    </div>
    <div class="card">
      <h2>Менің мақсатым</h2>
      <p>Жаңа нәрселер үйреніп, өз жобамды дамыту.</p>
      <button onclick="alert('Қош келдің!')">Басып көр!</button>
    </div>
  </main>
</body>
    </html>
