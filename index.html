<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 «Ә» сыныбы</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5fc;color:#192846}
header{background:linear-gradient(135deg,#101d42,#174b86);color:white;text-align:center;padding:32px 12px;border-bottom:5px solid #e9bd56}
header h1{margin:0 0 10px;font-size:32px}
header p{color:#f5d98b;margin:0}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;background:#fff;padding:12px;box-shadow:0 2px 8px #0001}
nav a{color:#173b70;text-decoration:none;font-weight:bold;padding:9px 12px;border-radius:8px}
nav a:hover{background:#edf2fb}
main{max-width:1050px;margin:auto;padding:20px 14px}
section{margin-bottom:32px;scroll-margin-top:15px}
h2{color:#173b70;border-bottom:2px solid #e9bd56;padding-bottom:10px}
.welcome{background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 4px 12px #15294d10}
input{width:100%;padding:13px;border:2px solid #d6deed;border-radius:10px;font-size:16px;margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:white;padding:17px;border-radius:12px;border-left:5px solid #e9bd56;box-shadow:0 3px 10px #15294d0d}
.card h3{color:#173b70;margin:9px 0}
.teacher{color:#5a6880;font-size:14px;line-height:1.5}
.tag{font-size:12px;color:#a57b1c;font-weight:bold}
.table-wrap{overflow-x:auto;background:white;border-radius:12px;box-shadow:0 3px 10px #15294d0d}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:13px 10px;text-align:center;border:1px solid #e0e6f0}
th{background:#173b70;color:white}
tbody tr:nth-child(even){background:#f5f7fc}
.note{color:#68758a;font-size:14px;line-height:1.6}
footer{background:#101d42;color:white;text-align:center;padding:22px 12px}
footer span{color:#f5d98b}
</style>
</head>
